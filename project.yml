name: rook
options:
  bundleIdPrefix: com.rook
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Release
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SDKROOT: macosx
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO

packages:
  rookCore:
    path: rookCore

targets:
  rook:
    type: application
    platform: macOS
    sources:
      - path: rook
        excludes:
          - "Info.plist"
          - "rook.entitlements"
          - "Resources/ghostty"
          - "Resources/terminfo"
          - "Resources/agent-status"
          - "Resources/agent-skill"
          - "Resources/hud"
          # the `ghostty +ssh-cache` shim: the post-build phase installs it at
          # Contents/MacOS/ghostty (where libghostty's GHOSTTY_BIN_DIR points), so it must
          # not ALSO land in Contents/Resources as a stray copy.
          - "Resources/ghostty-shim.sh"
          # committed SOURCE for rook's own bundled theme(s); setup.sh stages it
          # into Resources/ghostty/themes (above), so the source dir itself must not
          # be pulled into the project tree or the app bundle.
          - "Resources/custom-themes"
      # Ghostty resources (themes + shell-integration), downloaded by setup.sh.
      # Folder reference (not the default "group") because the contents are
      # extensionless files Xcode would otherwise skip. Lands at
      # Contents/Resources/ghostty — GHOSTTY_RESOURCES_DIR points here, matching
      # a real Ghostty.app so libghostty resolves themes/shell-integration and
      # derives TERMINFO as ../terminfo (the sibling dir below).
      - path: rook/Resources/ghostty
        type: folder
        buildPhase: resources
      # Compiled terminfo DB so TERM=xterm-ghostty resolves without a
      # Ghostty.app install. Folder reference preserves the hashed macOS layout
      # (terminfo/78/xterm-ghostty) and extensionless files. MUST land at
      # Contents/Resources/terminfo — a SIBLING of ghostty/ — so libghostty's
      # dirname(GHOSTTY_RESOURCES_DIR)/terminfo derivation hits it.
      - path: rook/Resources/terminfo
        type: folder
        buildPhase: resources
      # Agent-status hooks package (the wrapper + shell integration + codex
      # notify chain). Folder reference (not the default "group") so the
      # extensionless .sh files, the shell/ subdir, and the exec bit survive.
      # Lands at Contents/Resources/agent-status — the installer copies it from
      # there to ~/.config/rook/agent-status.
      - path: rook/Resources/agent-status
        type: folder
        buildPhase: resources
      # The session.hud panel painter. Folder reference (not the default "group") so hud.sh keeps its
      # exec bit. Lands at Contents/Resources/hud — ControlServer.helperCommand() resolves it there and
      # shell-escapes it into the overlay command.
      - path: rook/Resources/hud
        type: folder
        buildPhase: resources
      # Claude Code skill package (SKILL.md + reference.md + examples.md). Folder reference so the
      # whole dir copies verbatim to Contents/Resources/agent-skill; the installer copies it from
      # there to ~/.claude/skills/rook.
      - path: rook/Resources/agent-skill
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rook.app
        PRODUCT_NAME: rook
        # The name macOS shows (Dock, menu bar, Finder, ⌘-Tab). Info.plist takes it as a variable so the
        # Debug/dev build can call itself "Rook Dev" and be told apart from the deployed daily driver at a
        # glance — they are separate apps (distinct bundle ids), but both used to render as plain "Rook".
        BUNDLE_DISPLAY_NAME: Rook
        INFOPLIST_FILE: rook/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: rook/rook.entitlements
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0.0.0"
        GIT_COMMIT: ""
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS:
          - "-lc++"
        # Silence "umbrella header does not include header" warnings emitted
        # when Clang imports the GhosttyKit module — ghostty.h doesn't list
        # the vt/* sub-headers, and we can't modify the prebuilt xcframework.
        OTHER_SWIFT_FLAGS:
          - "-Xcc"
          - "-Wno-incomplete-umbrella"
      configs:
        # Debug/dev builds get a DISTINCT bundle id. XCUITest terminates any running instance of the
        # app-under-test's bundle id before launching, so a shared id would kill the deployed Release
        # app the user runs daily. Release keeps the real id (com.rook.app) — only Debug is
        # isolated. (State/socket are path-based, not bundle-id-derived, so dev/test launches must still
        # set ROOK_STATE_DIR to avoid touching the real app-support state.)
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.rook.app.debug
          # …and its own display name, so the dev instance is obvious in the Dock and ⌘-Tab next to the
          # deployed "Rook". Cosmetic only — the bundle id above is what actually separates them.
          BUNDLE_DISPLAY_NAME: Rook Dev
          # …and its own BUNDLE FILE name. The display name above is not enough: Spotlight and Finder
          # list an app by its .app FILENAME, so both builds showed up as an indistinguishable "Rook"
          # and launching the dev one by accident was a matter of picking the wrong row (verified with
          # `mdls -name kMDItemDisplayName`, which returned "Rook" for the Debug build despite its
          # CFBundleDisplayName). WRAPPER_NAME renames only the .app wrapper — PRODUCT_NAME stays
          # `rook`, so `Contents/MacOS/rook` and the bundled `rookctl` keep their paths and every
          # script that reaches inside the bundle is unaffected.
          WRAPPER_NAME: Rook Dev.app
    postBuildScripts:
      # build the rookctl CLI and bundle it at Contents/MacOS/rookctl so the
      # in-app "Install Command Line Tool" can symlink it into PATH. Runs before
      # Xcode's automatic code-sign, and signs the helper ad-hoc (matching the
      # app) so the app's signature seals an already-signed nested binary.
      - name: Bundle rookctl CLI
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # the app icon is the Icon Composer `AppIcon.icon`, compiled by actool into Assets.car +
          # AppIcon.icns. xcodegen also lists it in Copy Bundle Resources, so a redundant loose
          # AppIcon.icon lands in the bundle; remove it. A loose source `.icon` renders as the generic
          # placeholder grid (so it must not win over the compiled icon), and its source xattrs would
          # otherwise trip the re-seal below.
          rm -rf "$CODESIGNING_FOLDER_PATH/Contents/Resources/AppIcon.icon"
          core="$SRCROOT/rookCore"
          swift build --package-path "$core" -c release --product rookctl
          src="$(swift build --package-path "$core" -c release --product rookctl --show-bin-path)/rookctl"
          dest="$CODESIGNING_FOLDER_PATH/Contents/MacOS/rookctl"
          mkdir -p "$(dirname "$dest")"
          cp -f "$src" "$dest"
          # the `ghostty` shim: ghostty's shell integration calls "$GHOSTTY_BIN_DIR/ghostty
          # +ssh-cache" to remember which hosts already have our terminfo, and libghostty points
          # GHOSTTY_BIN_DIR at this very directory. Not a Mach-O, so it needs no signature of its
          # own — the app re-seal below covers it.
          install -m 755 "$SRCROOT/rook/Resources/ghostty-shim.sh" "$CODESIGNING_FOLDER_PATH/Contents/MacOS/ghostty"
          # ad-hoc sign the helper + re-seal the app (Debug/normal builds). Developer ID signing for
          # releases is done authoritatively by scripts/release.sh AFTER xcodebuild returns (so it
          # can't be clobbered by Xcode's own final code-sign, which also adds the required timestamp).
          codesign --force --options runtime --sign - "$dest"
          # re-seal the whole app: this phase can run AFTER Xcode's own code-sign on incremental
          # builds, so adding the helper would otherwise break the seal.
          #
          # A hosted unit-test bundle (rookTests) is copied into Contents/PlugIns, and during
          # `build-for-testing` this phase runs while that wrapper is still EMPTY (its Contents/MacOS
          # has no binary yet). Sealing the app validates every nested BUNDLE — that is not a --deep
          # behavior, dropping --deep does not avoid it — and an empty wrapper is rejected outright:
          # "bundle format unrecognized, invalid, or unsuitable". So remove the empty wrapper first,
          # exactly like the loose AppIcon.icon above; the rookTests target builds after the host and
          # lays down (and signs) its own bundle. Only EMPTY wrappers go: an already-built xctest is
          # left alone, so an incremental test build doesn't lose a bundle Xcode considers up to date.
          for plugin in "$CODESIGNING_FOLDER_PATH/Contents/PlugIns/"*.xctest; do
            if [ -d "$plugin" ] && [ -z "$(ls -A "$plugin/Contents/MacOS" 2>/dev/null)" ]; then
              rm -rf "$plugin"
            fi
          done
          # NOT --deep, for a second and independent reason: it would also descend into a POPULATED
          # xctest, which signs itself.
          # Signing each nested code object explicitly is what --deep was here for. That means every
          # file beside the executable, not just the Mach-O ones: the Debug rook.debug.dylib and
          # __preview.dylib (a shallow re-seal chokes on an unsigned dylib) AND the `ghostty` shell
          # shim — a shallow seal rejects it with "code object is not signed at all", even though a
          # script needs no signature of its own to RUN.
          # `if`, not `[ -e … ] && …`: under `set -e` the && form exits the whole phase the moment a
          # glob matches nothing.
          for nested in "$CODESIGNING_FOLDER_PATH/Contents/MacOS/"*; do
            if [ -f "$nested" ] && [ "$(basename "$nested")" != "$EXECUTABLE_NAME" ]; then
              codesign --force --options runtime --sign - "$nested"
            fi
          done
          codesign --force --options runtime --entitlements "$SRCROOT/rook/rook.entitlements" --sign - "$CODESIGNING_FOLDER_PATH"
    dependencies:
      - framework: GhosttyKit.xcframework
        embed: false
      - package: rookCore
      - sdk: AppKit.framework
      # libghostty calls Text Input Source Services (TISCopyCurrentKeyboard…)
      # which live in Carbon; required to link the prebuilt xcframework.
      - sdk: Carbon.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: Foundation.framework
      - sdk: IOKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework

  # In-process unit tests for app-target code that rookCore structurally cannot reach: anything needing
  # a real AppKit object graph (an NSSplitView's divider band, a tracking area's mouseMoved, the
  # process-global NSCursor) or a named NSPasteboard. Host-free logic still belongs in rookCore, where
  # `swift test` runs with no app host — this target is for what genuinely needs the host, not a second
  # home for logic that could have been hoisted.
  rookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - rookTests
    dependencies:
      - target: rook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rook.app.Tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        # as in the UI test bundle: XCTest APIs aren't Sendable-clean, and the strict checking the
        # app/rookCore use isn't needed here.
        SWIFT_STRICT_CONCURRENCY: minimal
        # ad-hoc signed like the UI runner; hardened runtime on a test bundle loaded into the host
        # trips a Team-ID mismatch.
        ENABLE_HARDENED_RUNTIME: NO
      # TEST_HOST is per-config because the Debug bundle is WRAPPED as "Rook Dev.app" (WRAPPER_NAME,
      # so Spotlight/Finder can tell the dev build from the deployed one) while Release stays
      # "rook.app". PRODUCT_NAME is `rook` in both, so only the wrapper differs. Getting this wrong
      # fails BEFORE any compilation, in xcodebuild's preflight: "Could not find test host for
      # rookTests".
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Rook Dev.app/Contents/MacOS/rook"
        Release:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/rook.app/Contents/MacOS/rook"

  rookUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - rookUITests
    dependencies:
      - target: rook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rook.app.UITests
        TEST_TARGET_NAME: rook
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        # UI test code drives XCTest APIs that aren't Sendable-clean; the strict
        # checking the app/rookCore use isn't needed (and breaks) here.
        SWIFT_STRICT_CONCURRENCY: minimal
        # the runner is ad-hoc signed; hardened runtime on the test bundle causes
        # a Team-ID mismatch when the runner loads the xctest bundle.
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  rook:
    build:
      targets:
        rook: all
        rookTests: [test]
        rookUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # ISOLATE THE TEST HOST. Without these, `xcodebuild test` launches rook with no state override: it
      # reads and rewrites the user's REAL workspaces.json, and its ControlServer.start() unlinks-then-binds
      # the DEFAULT socket path — stealing the control socket from the deployed daily driver mid-session.
      # The XCUITests set these themselves at launch, but a HOSTED unit-test bundle (rookTests) gets the
      # app the SCHEME launches, so the scheme is the only place that can protect it.
      # The socket path must stay SHORT: sun_path caps at ~104 bytes and a DerivedData-length path silently
      # fails to bind.
      environmentVariables:
        ROOK_STATE_DIR: /tmp/rook-test-state
        ROOK_CONTROL_SOCKET: /tmp/rook-test.sock
      targets:
        - rookTests
        - rookUITests
    archive:
      config: Release
