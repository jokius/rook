# rook built-in terminal defaults, loaded before ~/.config/ghostty/config so the
# user's own config still overrides them. widens libghostty's default 2px inner
# padding to 8px horizontally and 6px vertically.
window-padding-x = 8
window-padding-y = 6

# keep the cursor a steady block everywhere. the shell-integration `cursor`
# feature otherwise flips it to a bar at the prompt and back to a block while a
# command runs, which reads as an inconsistent cursor; no-cursor stops the shell
# from emitting the shape-change escapes so it stays at the block default.
#
# no-title stops ghostty's shell integration from auto-setting the terminal title
# to the abbreviated cwd on every prompt (the `…/a/b/c` path), which would always
# override the sidebar's cwd-basename name. explicit titles still win: a remote
# host over SSH, or a PROMPT_COMMAND emitting OSC 2, set the session's oscTitle and
# the sidebar shows that — we just don't auto-title local shells with the path.
#
# ssh-terminfo/ssh-env make `ssh` usable out of the box. TERM=xterm-ghostty is unknown
# to a stock remote host, and ncurses programs REFUSE to start there (`nano` dies with
# "Error opening terminal: xterm-ghostty."; vim only survives on its builtin termcap).
# The shell integration's ssh() wrapper uploads our terminfo to the host on first
# connect (`infocmp | ssh … tic -x -`, into the remote ~/.terminfo, no root needed) and
# only then keeps TERM=xterm-ghostty — falling back to xterm-256color if that fails.
# ssh-env forwards COLORTERM/TERM_PROGRAM so the remote still sees truecolor either way.
# The "already uploaded" memo goes through `$GHOSTTY_BIN_DIR/ghostty +ssh-cache`, which
# is why the bundle ships a `ghostty` shim next to rookctl (see Resources/ghostty-shim.sh).
cursor-style = block
shell-integration-features = no-cursor,no-title,ssh-env,ssh-terminfo

# disable ghostty's click-to-move-cursor at the shell prompt. with shell integration
# (OSC 133) a click in the prompt input emits arrow keys to move the shell cursor to the
# clicked column, but a double-click to SELECT a word (e.g. a branch name shown in the
# prompt) fires it too, jerking the cursor to the start of the line so a following paste
# lands in the wrong place. this governs only the shell-prompt click; a TUI's own mouse
# reporting (vim/htop/etc.) is a separate path and is unaffected. re-enable it in
# ~/.config/rook/ghostty.conf if you want the click-to-move behavior back.
cursor-click-to-move = false

# make ⌘C/⌘V/⌘A copy/paste/select-all work on non-Latin keyboard layouts. libghostty's
# built-in binds are unicode triggers (`super+c`/`super+v`/`super+a`), matched against
# the character the active layout produces — so on a Russian/Greek/etc. layout the
# physical V key yields `м`/etc. and the bind never fires. these physical-key
# triggers match by keycode (the physical position) regardless of the produced
# character, so they work on any layout. a Latin alternative layout (Dvorak/Colemak)
# that wants its own letter positions can re-bind these in ~/.config/rook/ghostty.conf.
#
# these are the FALLBACK layer: rook's standard Edit menu carries ⌘C/⌘V/⌘A as menu
# key equivalents, which AppKit matches against the produced CHARACTER and consumes
# before the terminal sees the key. the event reaches keyDown and these keycode binds
# fire in two cases: a non-Latin layout, where no equivalent matches, and a DISABLED item
# on any layout — Copy without a selection, Paste with nothing pasteable. select_all needs
# a bind too, or ⌘A silently does nothing on a Cyrillic/Greek layout.
#
# deliberately NOT `performable:`. that prefix consumes the key only when the action ran,
# so the disabled-item case fell through to key encoding: invisible under legacy encoding,
# which drops ⌘ chords on macOS, but the kitty keyboard protocol reports them and any TUI
# enabling it renders the key report as text.
keybind = super+key_c=copy_to_clipboard
keybind = super+key_v=paste_from_clipboard
keybind = super+key_a=select_all
